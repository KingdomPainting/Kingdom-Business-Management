<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Projects — Kingdom Painting Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Document viewer with download + signature for contracts
function downloadDoc(html, title){
  var blob=new Blob([html],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=title.replace(/\s+/g,'_')+'.html';
  a.click();
}

function viewDoc(html, title, dealId, isContract){
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;flex-direction:column;';
  var btnStyle='font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;border:none;';
  var bar=document.createElement('div');
  bar.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;gap:10px;flex-wrap:wrap;';
  var title_el='<span style="font-weight:700;font-size:15px;flex:1">'+title+'</span>';
  var dl_btn='<button onclick="downloadDoc('+JSON.stringify(html)+','+JSON.stringify(title)+')" style="'+btnStyle+'background:#1a1714;color:#fff;">⬇ Download</button>';
  var close_btn='<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="'+btnStyle+'background:#f3f3f3;color:#333;font-size:18px;">✕</button>';
  var sig_section='';
  if(isContract&&dealId){
    sig_section='<div id="sig-section-'+dealId+'" style="padding:16px;background:#fff8f0;border-top:1px solid #edd;flex-shrink:0">'
      +'<p style="font-size:13px;font-weight:600;margin-bottom:8px">✍ Sign Contract</p>'
      +'<p style="font-size:12px;color:#666;margin-bottom:10px">Draw your signature below then click Submit</p>'
      +'<canvas id="sig-canvas-'+dealId+'" width="500" height="100" style="border:1px solid #ccc;border-radius:6px;background:#fff;touch-action:none;cursor:crosshair;display:block;max-width:100%"></canvas>'
      +'<div style="display:flex;gap:8px;margin-top:10px">'
      +'<button onclick="clearSigCanvas('+JSON.stringify(dealId)+')" style="'+btnStyle+'background:#f3f3f3;color:#333;font-size:12px;">Clear</button>'
      +'<button onclick="submitSignature('+JSON.stringify(dealId)+','+JSON.stringify(html)+')" style="'+btnStyle+'background:#2e7d32;color:#fff;font-size:12px;">Submit Signature</button>'
      +'</div>'
      +'<div id="sig-msg-'+dealId+'" style="margin-top:8px;font-size:12px;color:#2e7d32;display:none">✓ Signature saved! Thank you.</div>'
      +'</div>';
  }
  bar.innerHTML=title_el+dl_btn+close_btn;
  var frame=document.createElement('div');
  frame.style.cssText='flex:1;overflow:auto;background:#f5f5f5;padding:20px;';
  frame.innerHTML=html;
  overlay.appendChild(bar);
  overlay.appendChild(frame);
  if(sig_section){
    var sigDiv=document.createElement('div');
    sigDiv.innerHTML=sig_section;
    overlay.appendChild(sigDiv.firstElementChild);
  }
  document.body.appendChild(overlay);
  if(isContract&&dealId) initSigCanvas(dealId);
}

var _sigState={};
function initSigCanvas(dealId){
  var canvas=document.getElementById('sig-canvas-'+dealId);
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var drawing=false;
  _sigState[dealId]={ctx,canvas,hasStrokes:false};
  function getPos(e){
    var r=canvas.getBoundingClientRect();
    var touch=e.touches?e.touches[0]:e;
    return{x:(touch.clientX-r.left)*(canvas.width/r.width),y:(touch.clientY-r.top)*(canvas.height/r.height)};
  }
  canvas.addEventListener('mousedown',function(e){drawing=true;var p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  canvas.addEventListener('mousemove',function(e){if(!drawing)return;var p=getPos(e);ctx.lineWidth=2;ctx.strokeStyle='#1a1714';ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke();_sigState[dealId].hasStrokes=true;});
  canvas.addEventListener('mouseup',function(){drawing=false;});
  canvas.addEventListener('mouseleave',function(){drawing=false;});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();drawing=true;var p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();if(!drawing)return;var p=getPos(e);ctx.lineWidth=2;ctx.strokeStyle='#1a1714';ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke();_sigState[dealId].hasStrokes=true;},{passive:false});
  canvas.addEventListener('touchend',function(){drawing=false;});
}

function clearSigCanvas(dealId){
  var s=_sigState[dealId];if(!s)return;
  s.ctx.clearRect(0,0,s.canvas.width,s.canvas.height);
  s.hasStrokes=false;
}

async function submitSignature(dealId, contractHtml){
  var s=_sigState[dealId];
  if(!s||!s.hasStrokes){alert('Please draw your signature first.');return;}
  var sigImg=s.canvas.toDataURL('image/png');
  var today=new Date().toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'});
  // Inject signature into contract HTML
  var signedHtml=contractHtml+'<div style="page-break-inside:avoid;margin-top:40px;padding:20px;border-top:2px solid #1a1714;font-family:Montserrat,sans-serif">'
    +'<p style="font-weight:700;font-size:14px;margin-bottom:12px">Client Signature</p>'
    +'<img src="'+sigImg+'" style="border:1px solid #ccc;border-radius:4px;max-width:300px;display:block;margin-bottom:8px"/>'
    +'<p style="font-size:12px;color:#555">Signed digitally on '+today+'</p>'
    +'</div>';
  // Save to Supabase
  var {error}=await sb.from('deals').update({
    contract_signed_html:signedHtml,
    contract_signed_at:new Date().toISOString()
  }).eq('id',dealId);
  if(error){alert('Could not save signature. Please try again.');return;}
  var msg=document.getElementById('sig-msg-'+dealId);
  if(msg){msg.style.display='block';}
  // Offer download
  setTimeout(function(){downloadDoc(signedHtml,'Signed_Contract');},800);
}
</script>
<style>
  :root{
    --bg:#ede9de;
    --fg:#2e3557;
    --card:#ede9de;
    --border:#d6d1c3;
    --muted:#c8c2b2;
    --muted-fg:#757575;
    --primary:#d4a96a;
    --primary-fg:#0a0a0a;
    --destructive:#ef4444;
    --radius:0.25rem;
    --shadow:0 1px 4px rgba(0,0,0,.15);
    --shadow-lg:0 8px 40px rgba(0,0,0,.18);
    --r:6px;--r2:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{background:#EDE9DE;font-family:'Montserrat',sans-serif;color:var(--fg);min-height:100vh;font-size:14px}

  /* ── Header ── */
  .header{background:#EDE9DE;border-bottom:1px solid rgba(38,46,75,.15);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo img{height:38px;width:auto;display:block}
  .logo-text{display:flex;flex-direction:column;line-height:1.2}
  .logo-name{font-size:14px;font-weight:700;color:#262E4B;letter-spacing:.04em;text-transform:uppercase}
  .logo-sub{font-size:9px;color:var(--primary);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
  .user-pill{display:flex;align-items:center;gap:8px;background:rgba(38,46,75,.08);border:1px solid rgba(38,46,75,.2);border-radius:20px;padding:5px 14px 5px 5px;font-size:12px;color:#262E4B}
  .user-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--fg);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .signout-btn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;cursor:pointer;padding:5px 12px;border-radius:var(--r);transition:all .15s}
  .signout-btn:hover{background:rgba(38,46,75,.08);color:#262E4B}

  /* ── Login screen ── */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#262E4B}
  .login-wrap{width:100%;max-width:400px}
  .login-logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
  .login-logo-wrap img{height:56px;width:auto}
  .login-card{background:#EDE9DE;border-radius:16px;padding:32px 28px;box-shadow:0 8px 40px rgba(0,0,0,.30)}
  .login-title{font-size:20px;font-weight:700;margin-bottom:20px;color:#1a1714}
  .login-subtitle{font-size:12px;color:#7a6e65;margin-top:-14px;margin-bottom:18px}
  .input-group{margin-bottom:14px}
  .input-group label{display:block;font-size:12px;font-weight:600;color:#4a3f36;margin-bottom:5px}
  .input-group input{width:100%;padding:10px 13px;border:1.5px solid #c8bfb4;border-radius:8px;font-size:13px;font-family:'Montserrat',sans-serif;color:#1a1714;background:#fff;outline:none;box-sizing:border-box;transition:border-color .15s}
  .input-group input:focus{border-color:#C4922A}
  .btn-primary{width:100%;background:#C4922A;color:#fff;border:none;border-radius:8px;padding:12px 0;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;transition:opacity .15s,background .15s;letter-spacing:.02em;margin-top:10px}
  .btn-primary:hover{background:#b07e20}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .login-msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:12px;display:none;text-align:left}
  .login-msg.success{background:rgba(34,197,94,.1);color:#15803d;border:1px solid rgba(34,197,94,.3)}
  .login-msg.error{background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.3)}
  .login-divider{margin:18px 0;display:flex;align-items:center;gap:12px;color:#7a6e65;font-size:11px}
  .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:#c8bfb4}

  /* ── Portal ── */
  #portal-screen{display:none;min-height:100vh;background:#EDE9DE}
  .portal-body{max-width:1040px;margin:0 auto;padding:32px 24px 48px}
  .section-header{margin-bottom:20px}
  .section-title{font-size:17px;font-weight:700;color:var(--fg);margin-bottom:3px}
  .section-sub{font-size:12px;color:var(--muted-fg)}
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:44px}
  .empty-state{grid-column:1/-1;background:rgba(255,255,255,.5);border:1.5px dashed var(--border);border-radius:var(--r2);padding:40px;text-align:center;color:var(--muted-fg);font-size:13px}
  .empty-icon{margin:0 auto 12px;opacity:.35;width:36px;height:36px}

  /* ── Project card ── */
  .proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .18s,transform .18s;cursor:default}
  .proj-card:hover{box-shadow:0 6px 22px rgba(0,0,0,.13);transform:translateY(-2px)}
  .card-top{padding:16px 18px 13px;border-bottom:1px solid var(--border)}
  .card-stage{display:inline-flex;align-items:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:20px;margin-bottom:9px}
  .stage-Lead{background:#e8eaf6;color:#3949ab}
  .stage-Proposal{background:#e3f2fd;color:#1565c0}
  .stage-Scheduled{background:#f3e5f5;color:#7b1fa2}
  .stage-Completed{background:#e8f5e9;color:#2e7d32}
  .card-name{font-size:14px;font-weight:700;color:var(--fg);line-height:1.35;margin-bottom:5px}
  .card-addr{font-size:11px;color:var(--muted-fg);display:flex;align-items:center;gap:4px}
  .card-bottom{padding:13px 18px}
  .card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
  .card-value-gold{color:var(--primary);font-size:16px;font-weight:700}
  .dates-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .date-block{background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px}
  .date-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-fg);margin-bottom:3px}
  .date-val{font-size:13px;font-weight:600;color:var(--fg)}

  /* ── Confirmation step ── */
  #confirm-step{display:none}

  /* ── Spinner ── */
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:500px){
    .login-card{padding:32px 22px}
    .portal-body{padding:20px 14px 40px}
    .header{padding:0 16px}
  }
</style>
</head>

      <div class="login-title">Sign in</div>
      <div class="login-subtitle">Client Portal</div>

      <div id="email-step">
        <div class="input-group">
          <label>Email address</label>
          <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <button class="btn-primary" id="send-otp-btn" onclick="sendMagicLink()">Send Confirmation Email</button>
      </div>

      <div id="confirm-step" style="display:none">
        <div class="login-divider">Check your email</div>
        <p style="font-size:12px;color:#4a3f36;margin-bottom:14px;line-height:1.6" id="otp-hint">We sent a 6-digit code to your email. Enter it below.</p>
        <div class="input-group">
          <label>6-digit code</label>
          <input type="text" id="otp-code" placeholder="123456" maxlength="6" autocomplete="one-time-code"
            style="letter-spacing:0.2em;font-size:20px;text-align:center;font-weight:700"
            onkeydown="if(event.key==='Enter')verifyOtp()"/>
        </div>
        <button class="btn-primary" id="verify-otp-btn" onclick="verifyOtp()">Sign In</button>
        <button style="width:100%;background:none;border:none;color:#7a6e65;font-family:'Montserrat',sans-serif;font-size:11px;cursor:pointer;padding:9px;margin-top:8px" onclick="backToEmail()">&#8592; Use a different email</button>
      </div>

      <div class="login-msg" id="login-msg"></div>
    </div>

<script>
const SUPA_URL='https://cyzvmcmlpnozwrqifrdt.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5enZtY21scG5vendycWlmcmR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Mzk1MzEsImV4cCI6MjA5NDIxNTUzMX0.IeZRx5xcPddSQcL77vhKjOgAKFi8bKpj3dMfajHpV3c';
const{createClient}=supabase;
const sb=createClient(SUPA_URL,SUPA_KEY);
let currentEmail='';

sb.auth.getSession().then(({data:{session}})=>{if(session)showPortal(session.user.email);});
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session)showPortal(session.user.email);
  if(event==='SIGNED_OUT')showLogin();
});

function showMsg(msg,type){const el=document.getElementById('login-msg');el.textContent=msg;el.className='login-msg '+type;el.style.display='block';}
function hideMsg(){document.getElementById('login-msg').style.display='none';}

async function sendMagicLink(){
  const emailEl=document.getElementById('email-input');
  const email=(emailEl&&emailEl.value||'').trim().toLowerCase();
  if(!email||!email.includes('@')){showMsg('Please enter a valid email address.','error');return;}
  currentEmail=email;
  const btn=document.getElementById('send-otp-btn');
  if(btn){btn.disabled=true;btn.textContent='Sending…';}
  try{
    // Use OTP token type — sends a 6-digit code, no redirect URL needed
    const{data,error}=await sb.auth.signInWithOtp({
      email:email,
      options:{shouldCreateUser:true}
    });
    if(btn){btn.disabled=false;btn.textContent='Send Confirmation Email';}
    if(error){
      console.error('OTP error:',error.message,error.status,error.code);
      showMsg(error.message||'Could not send email. Please try again.','error');
      return;
    }
    document.getElementById('email-step').style.display='none';
    document.getElementById('confirm-step').style.display='block';
    var hintEl=document.getElementById('otp-hint');
    if(hintEl)hintEl.textContent='We sent a 6-digit code to '+email+'. Enter it below to sign in.';
    hideMsg();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Send Confirmation Email';}
    console.error('sendMagicLink exception:',e);
    showMsg('Error: '+e.message,'error');
  }
}

async function verifyOtp(){
  const code=(document.getElementById('otp-code').value||'').trim();
  if(!code||code.length<6){showMsg('Please enter the 6-digit code from your email.','error');return;}
  const btn=document.getElementById('verify-otp-btn');
  if(btn){btn.disabled=true;btn.textContent='Verifying…';}
  try{
    const{data,error}=await sb.auth.verifyOtp({email:currentEmail,token:code,type:'email'});
    if(btn){btn.disabled=false;btn.textContent='Sign In';}
    if(error){showMsg(error.message||'Invalid code. Please try again.','error');return;}
    // Auth state change will trigger showPortal
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Sign In';}
    showMsg('Error: '+e.message,'error');
  }
}
function backToEmail(){
  document.getElementById('confirm-step').style.display='none';
  document.getElementById('email-step').style.display='block';
  hideMsg();
}
async function signOut(){await sb.auth.signOut();}
function showLogin(){document.getElementById('login-screen').style.display='flex';document.getElementById('portal-screen').style.display='none';}

async function showPortal(email){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('portal-screen').style.display='block';
  document.getElementById('user-email-display').textContent=email;
  document.getElementById('user-avatar').textContent=email[0].toUpperCase();
  await loadDeals(email);
}

async function loadDeals(email){
  document.getElementById('loading-deals').style.display='block';
  document.getElementById('deals-content').style.display='none';
  const{data,error}=await sb.rpc('get_client_deals',{client_email:email});
  document.getElementById('loading-deals').style.display='none';
  document.getElementById('deals-content').style.display='block';
  if(error||!data){console.error('Error loading deals:',error);renderGrid('active-grid',[],'No active projects found.');renderGrid('past-grid',[],'No completed projects yet.');return;}
  renderGrid('active-grid',data.filter(d=>d.stage!=='Completed'),'No active projects found.');
  renderGrid('past-grid',data.filter(d=>d.stage==='Completed'),'No completed projects yet.');
}

function fmtDate(s){
  if(!s)return'—';
  const[y,m,d]=s.split('-');if(!y||!m||!d)return s;
  return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m,10)-1]+' '+parseInt(d,10)+', '+y;
}
function fmtCurrency(v){if(!v)return'—';return'$'+parseFloat(v).toLocaleString('en-CA',{minimumFractionDigits:0,maximumFractionDigits:0});}
function getDateRange(deal){
  let start=deal.startDate||null,end=deal.endDate||null;
  if(!start&&deal.scheduleDays&&deal.scheduleDays.length){
    const s=[...deal.scheduleDays].sort((a,b)=>a.date>b.date?1:-1);
    start=s[0].date;end=s[s.length-1].date;
  }
  return{start,end};
}
function esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderGrid(id,deals,empty){
  const g=document.getElementById(id);
  if(!deals.length){
    g.innerHTML='<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'+empty+'</div>';
    return;
  }
  g.innerHTML=deals.map(deal=>{
    const{start,end}=getDateRange(deal);
    return'<div class="proj-card"><div class="card-top">'
      +'<div class="card-stage stage-'+esc(deal.stage||'Lead')+'">'+esc(deal.stage||'Lead')+'</div>'
      +'<div class="card-name">'+esc(deal.dealName||'Unnamed Project')+'</div>'
      +(deal.address?'<div class="card-addr"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+esc(deal.address)+'</div>':'')
      +(deal.rooms&&deal.rooms.length?'<div style="margin-top:8px">'+(deal.rooms.map(function(r){return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;"><span style="width:12px;height:12px;border-radius:3px;border:1.5px solid var(--primary);display:inline-block;background:'+(r.done?'var(--primary)':'transparent')+';flex-shrink:0"></span><span style="font-size:12px;color:'+(r.done?'var(--muted-fg)':'#1a1a1a')+';text-decoration:'+(r.done?'line-through':'none')+'">'+(r.name||'Room')+(r.sqft?' <span style="font-size:10px;color:var(--primary);font-weight:600;">'+r.sqft+' sqft</span>':'')+'</span></div>';}).join('')+'<div style="margin-top:6px;display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:10px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.05em">'+deal.rooms.filter(function(r){return r.done;}).length+'/'+deal.rooms.length+' rooms done</span><span style="font-size:10px;font-weight:700;color:var(--primary)">'+(deal.progress||0)+'%</span></div><div style="height:5px;background:rgba(0,0,0,.08);border-radius:9px;overflow:hidden"><div style="height:100%;background:var(--primary);border-radius:9px;width:'+(deal.progress||0)+'%"></div></div></div>':'')
      +(deal.quote_html||deal.contract_html||deal.change_order_html||deal.invoice_html?'<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.06);display:flex;gap:8px;flex-wrap:wrap">'
        +(deal.quote_html?'<button onclick="viewDoc('+JSON.stringify(deal.quote_html)+',\'Quote\',null,false)" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer;font-weight:600;">📄 Quote</button>':'')
        +(deal.contract_signed_html?'<button onclick="viewDoc('+JSON.stringify(deal.contract_signed_html)+',\'Signed Contract\',null,false)" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #2e7d32;background:transparent;color:#2e7d32;cursor:pointer;font-weight:600;">✅ Signed Contract</button>':'<span></span>')
        +(deal.contract_html&&!deal.contract_signed_html?'<button onclick="viewDoc('+JSON.stringify(deal.contract_html)+',\'Contract\','+JSON.stringify(deal.id)+',true)" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer;font-weight:600;">📋 Sign Contract</button>':'')
        +(deal.change_order_html?'<button onclick="viewDoc('+JSON.stringify(deal.change_order_html)+',\'Change Order\',null,false)" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer;font-weight:600;">📝 Change Order</button>':'')
        +(deal.invoice_html?'<button onclick="viewDoc('+JSON.stringify(deal.invoice_html)+',\'Invoice\',null,false)" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #1a1714;background:transparent;color:#1a1714;cursor:pointer;font-weight:600;">🧾 Invoice</button>':'')
        +'</div>':'')
      +'</div><div class="card-bottom">'
      +'<div class="card-row"><span class="card-label">Project Value</span><span class="card-value-gold">'+fmtCurrency(deal.value)+'</span></div>'
      +'<div class="dates-row">'
      +'<div class="date-block"><div class="date-lbl">Start Date</div><div class="date-val">'+fmtDate(start)+'</div></div>'
      +'<div class="date-block"><div class="date-lbl">End Date</div><div class="date-val">'+fmtDate(end)+'</div></div>'
      +'</div></div></div>';
  }).join('');
}

document.getElementById('email-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendMagicLink();});

</script>
</body>
</html>
