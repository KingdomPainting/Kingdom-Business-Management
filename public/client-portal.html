<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Client Portal — Kingdom Painting Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh}
body{font-family:'Montserrat',sans-serif;background:#262E4B;display:flex;align-items:center;justify-content:center;padding:20px}
.login-wrap{width:100%;max-width:400px}
.login-logo{display:flex;justify-content:center;margin-bottom:28px}
.card{background:#EDE9DE;border-radius:16px;padding:32px 28px;box-shadow:0 8px 40px rgba(0,0,0,.35)}
.card h2{font-size:20px;font-weight:700;color:#1a1714;margin-bottom:6px}
.card .sub{font-size:12px;color:#7a6e65;margin-bottom:22px}
.card label{display:block;font-size:12px;font-weight:600;color:#4a3f36;margin-bottom:5px}
.card input[type=email],.card input[type=password]{width:100%;padding:10px 13px;border:1.5px solid #c8bfb4;border-radius:8px;font-size:13px;font-family:inherit;color:#1a1714;background:#fff;outline:none;margin-bottom:14px;transition:border-color .15s}
.card input[type=email]:focus,.card input[type=password]:focus{border-color:#C4922A}
.btn-gold{width:100%;background:#C4922A;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px}
.btn-gold:disabled{opacity:.5;cursor:not-allowed}
.back-btn{background:none;border:none;color:#7a6e65;font-family:inherit;font-size:11px;cursor:pointer;margin-top:12px;width:100%}
.login-msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:12px;display:none}
.login-msg.error{background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.3);display:block}
.login-msg.ok{background:rgba(34,197,94,.1);color:#15803d;border:1px solid rgba(34,197,94,.3);display:block}
#portal{display:none;width:100%;min-height:100vh;flex-direction:column}
body.authed{background:#f0ede6;align-items:flex-start;padding:0;justify-content:flex-start}
body.authed #portal{display:flex}
.p-header{background:#262E4B;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.p-signout{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:6px 14px;border-radius:6px}
.p-body{flex:1;max-width:860px;width:100%;margin:0 auto;padding:32px 24px}
.p-title{font-size:22px;font-weight:800;color:#262E4B;margin-bottom:6px}
.p-subtitle{font-size:13px;color:#7a6e65;margin-bottom:28px}
.proj-card{background:#fff;border:1px solid #ddd9d0;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.proj-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.13)}
.proj-card-head{padding:18px 20px}
.proj-stage-pill{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 10px;border-radius:20px;margin-bottom:8px}
.proj-name{font-size:16px;font-weight:700;color:#1a1714;margin-bottom:4px}
.proj-addr{font-size:12px;color:#7a6e65;margin-bottom:10px}
.proj-val{font-size:14px;color:#C4922A;font-weight:700}
.proj-progress{margin-top:12px}
.prog-label{font-size:11px;color:#7a6e65;margin-bottom:4px}
.prog-bar{height:6px;background:#e5e1d8;border-radius:9px;overflow:hidden}
.prog-fill{height:100%;background:#C4922A;border-radius:9px}
.proj-docs{border-top:1px solid #ede9df;padding:14px 16px;background:#faf8f4}
.doc-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border:1px solid #e5e1d8;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:background .12s,border-color .12s}.doc-row:hover{background:#f5f3ef;border-color:#C4922A}
.doc-label{font-size:13px;font-weight:600;color:#262E4B;display:flex;align-items:center;gap:8px}
.doc-signed{font-size:11px;color:#16a34a;font-weight:600}
.doc-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;border:none}
.doc-btn.view{background:#EDE9DE;color:#262E4B}
.doc-btn.sign{background:#C4922A;color:#fff}
.no-docs{font-size:12px;color:#9ca3af;padding:4px 0}
.section-sep{margin:28px 0 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;border-bottom:1px solid #e5e1d8;padding-bottom:8px}
#doc-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;flex-direction:column}
#doc-overlay.open{display:flex}
.doc-overlay-bar{background:#262E4B;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.doc-overlay-title{color:#fff;font-size:14px;font-weight:700;flex:1}
.doc-close{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;font-family:inherit;font-size:12px;cursor:pointer;padding:5px 14px;border-radius:6px}
.doc-overlay-body{flex:1;overflow:auto;background:#fff}
#doc-frame{width:100%;height:100%;border:none}
#sig-panel{display:none;background:#faf8f4;border-top:3px solid #C4922A;padding:20px 24px;flex-shrink:0}
#sig-panel h3{font-size:14px;font-weight:700;color:#262E4B;margin-bottom:6px}
#sig-panel p{font-size:12px;color:#7a6e65;margin-bottom:12px}
#sig-canvas{border:1.5px solid #c8bfb4;border-radius:8px;background:#fff;display:block;cursor:crosshair;touch-action:none;width:100%;max-width:500px;height:120px}
.sig-actions{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.btn-clear{background:none;border:1px solid #c8bfb4;color:#7a6e65;font-family:inherit;font-size:12px;cursor:pointer;padding:8px 16px;border-radius:6px}
.btn-save-sig{background:#C4922A;color:#fff;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:9px 24px;border-radius:6px}
.btn-save-sig:disabled{opacity:.5;cursor:not-allowed}
.sig-status{font-size:12px;font-weight:600}
#toast{position:fixed;bottom:28px;right:28px;background:#262E4B;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:99999;display:none;max-width:340px}
</style>
</head>
<body>

  <div class="card">
    <h2>Client Portal</h2>
    <p class="sub">Sign in to view your projects</p>
    <div id="signin-form">
      <label for="p-email">Email address</label>
      <input type="email" id="p-email" placeholder="you@example.com" autocomplete="email"/>
      <label for="p-password" style="margin-top:4px">Password</label>
      <input type="password" id="p-password" placeholder="••••••••" autocomplete="current-password"/>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL='https://cyzvmcmlpnozwrqifrdt.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5enZtY21scG5vendycWlmcmR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Mzk1MzEsImV4cCI6MjA5NDIxNTUzMX0.IeZRx5xcPddSQcL77vhKjOgAKFi8bKpj3dMfajHpV3c';
const sb=createClient(SUPA_URL,SUPA_KEY);

let currentEmail='';
let currentDealId=null;
let allDeals=[];
let sigDrawing=false;

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',5000);}
function loginMsg(t,type){const el=document.getElementById('login-msg');el.textContent=t;el.className='login-msg '+type;}

function stageStyle(stage){
  const m={'Lead':'#dbeafe;color:#1d4ed8','Contacted':'#ede9fe;color:#7c3aed','Quote Sent':'#fef9c3;color:#a16207','Scheduled':'#ffedd5;color:#ea580c','In Progress':'#d1fae5;color:#065f46','Archive':'#f3f4f6;color:#6b7280'};
  return 'background:'+(m[stage]||'#f3f4f6;color:#6b7280');
}

function docRows(d){
  const docs=[
    {key:'quote_html',label:'Quote',icon:'&#128196;'},
    {key:'contract_html',label:'Contract',icon:'&#128203;',signable:true},
    {key:'change_order_html',label:'Change Order',icon:'&#128221;'},
    {key:'invoice_html',label:'Invoice',icon:'&#129534;'}
  ].filter(doc=>d[doc.key]);
  // Add Drive files
  const driveFiles=d.drive_files||[];
  if(!docs.length&&!driveFiles.length)return '<p class="no-docs">No documents available yet.</p>';
  const signed=d.contract_signed_html&&d.contract_signed_at;
  const signedDate=signed?new Date(d.contract_signed_at).toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}):'';
  const driveRows=driveFiles.map(file=>`
    <div class="doc-row" onclick="window.open('${file.url}','_blank')" style="cursor:pointer">
      <span class="doc-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M6.5 20L1 11l4-7h14l4 7-5.5 9H6.5z" stroke="#4285f4" stroke-width="1.5"/><path d="M8.5 20L14 11H1" stroke="#4285f4" stroke-width="1.5"/><path d="M23 11H14l-5.5 9" stroke="#4285f4" stroke-width="1.5"/></svg>
        ${file.name}
      </span>
      <span style="font-size:11px;color:#4285f4;font-weight:600">Open ↗</span>
    </div>`).join('');
  return docs.map(doc=>{
    const isSigned=doc.signable&&signed;
    const badge=isSigned?`<span class="doc-signed">&#9989; Signed ${signedDate}</span>`:'';
    const canSign=doc.signable&&!isSigned;
    const signBadge=canSign?'<span style="font-size:10px;font-weight:700;color:#C4922A;background:#fff8ee;border:1px solid #C4922A;padding:1px 7px;border-radius:20px;margin-left:6px">Sign</span>':'';
    return `<div class="doc-row" onclick="openDoc('${doc.key}','${doc.label}','${d.id}',${canSign})" style="cursor:pointer">
      <span class="doc-label">${doc.icon} ${doc.label}${signBadge} ${badge}</span>
      <span style="font-size:11px;color:#7a6e65;font-weight:600">Open &#8599;</span>
    </div>`;
  }).join('')+driveRows;
}

function projCard(d,past){
  const pct=Math.min(100,Math.max(0,d.progress||0));
  const hasDocs=d.quote_html||d.contract_html||d.change_order_html||d.invoice_html;
  return `<div class="proj-card">
    <div class="proj-card-head">
      <div class="proj-stage-pill" style="${stageStyle(d.stage)}">${d.stage||'Lead'}</div>
      <div class="proj-name">${d.dealName||'Project'}</div>
      ${d.address?`<div class="proj-addr">&#128205; ${d.address}</div>`:''}
      ${d.value?`<div class="proj-val">$${parseFloat(d.value).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>`:''}
      ${!past?`<div class="proj-progress"><div class="prog-label">Progress &mdash; ${pct}%</div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`:''}
    </div>
    <div class="proj-docs">${hasDocs?docRows(d):'<p class="no-docs">No documents yet.</p>'}</div>
  </div>`;
}

async function loadProjects(email){
  const {data,error}=await sb.rpc('get_client_deals',{client_email:email});
  if(error){document.getElementById('active-projects').innerHTML=`<p style="color:#dc2626;font-size:13px">Error: ${error.message}</p>`;return;}
  if(!data||!data.length){document.getElementById('active-projects').innerHTML='<p style="color:#9ca3af;font-size:13px">No projects found for this email.</p>';return;}
  allDeals=data;
  const active=data.filter(d=>d.stage!=='Archive');
  const past=data.filter(d=>d.stage==='Archive');
  document.getElementById('active-projects').innerHTML=active.length?active.map(d=>projCard(d,false)).join(''):'<p style="color:#9ca3af;font-size:13px">No active projects.</p>';
  if(past.length){document.getElementById('past-sep').style.display='';document.getElementById('past-projects').innerHTML=past.map(d=>projCard(d,true)).join('');}
}



function wrapDocHtml(html){
  // If already a full HTML document, inject base styles then use as-is
  if(html&&(html.trim().toLowerCase().startsWith('<!doctype')||html.trim().toLowerCase().startsWith('<html'))){
    // Inject font + body padding into the existing <head> if possible
    const fontLink='<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>';
    const baseStyle='<style>body{padding:32px;max-width:860px;margin:0 auto;}@media print{body{padding:16px}}</style>';
    if(html.includes('</head>')){
      return html.replace('</head>',fontLink+baseStyle+'</head>');
    }
    return html;
  }
  // Fragment — wrap in a full document
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<style>
:root{--bg:#ede9de;--fg:#2e3557;--ink:#1a1714;--ink2:#3a3530;--ink3:#7a6e65;--cream:#ede9de;--cream2:#e0dbd0;--cream3:#c8bfb4;--gold:#C4922A;--gold2:#b07e20;--r:6px;--r2:12px;--sans:'Montserrat',sans-serif;}
*{box-sizing:border-box}
body{font-family:'Montserrat',Georgia,sans-serif;background:#fff;color:#1a1714;padding:32px;max-width:860px;margin:0 auto;font-size:13px;line-height:1.7}
</style>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head><body>${html}</body></html>`;
}

window.openDoc=function(key,label,dealId,signable){
  const d=allDeals.find(x=>x.id===dealId);
  if(!d||!d[key])return;
  currentDealId=dealId;
  document.getElementById('overlay-title').textContent=label;
  document.getElementById('doc-overlay').style.display='flex';
  // Use blob URL so CSS vars and full HTML doc render correctly
  const wrapped=wrapDocHtml(d[key]);
  const blob=new Blob([wrapped],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const frame=document.getElementById('doc-frame');
  // Revoke previous blob URL to avoid memory leak
  if(frame._blobUrl)URL.revokeObjectURL(frame._blobUrl);
  frame._blobUrl=url;
  frame.src=url;
  const sp=document.getElementById('sig-panel');
  if(signable&&!d.contract_signed_html){sp.style.display='block';initSig();}
  else sp.style.display='none';
};

document.getElementById('overlay-close').addEventListener('click',()=>{
  document.getElementById('doc-overlay').style.display='none';
  const frame=document.getElementById('doc-frame');
  if(frame._blobUrl){URL.revokeObjectURL(frame._blobUrl);frame._blobUrl=null;}
  frame.src='about:blank';
});

let sigCanvas,sigCtx;
function initSig(){
  sigCanvas=document.getElementById('sig-canvas');
  sigCtx=sigCanvas.getContext('2d');
  sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);
  sigCtx.strokeStyle='#1a1714';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';sigCtx.lineJoin='round';
  document.getElementById('sig-status').textContent='';
  function getPos(e){const r=sigCanvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(sigCanvas.width/r.width),y:(src.clientY-r.top)*(sigCanvas.height/r.height)};}
  sigCanvas.onmousedown=sigCanvas.ontouchstart=e=>{e.preventDefault();sigDrawing=true;const p=getPos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  sigCanvas.onmousemove=sigCanvas.ontouchmove=e=>{e.preventDefault();if(!sigDrawing)return;const p=getPos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();};
  sigCanvas.onmouseup=sigCanvas.ontouchend=()=>{sigDrawing=false;};
}

document.getElementById('sig-clear').addEventListener('click',()=>{if(sigCtx)sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);});

document.getElementById('sig-save').addEventListener('click',async()=>{
  if(!sigCanvas||!currentDealId)return;
  const px=sigCtx.getImageData(0,0,sigCanvas.width,sigCanvas.height).data;
  if(!Array.from(px).some((v,i)=>i%4===3&&v>0)){
    const s=document.getElementById('sig-status');s.textContent='Please draw your signature first.';s.style.color='#dc2626';return;
  }
  const btn=document.getElementById('sig-save');btn.disabled=true;btn.textContent='Saving...';
  const sigImg=sigCanvas.toDataURL('image/png');
  const now=new Date().toLocaleString('en-CA',{dateStyle:'long',timeStyle:'short'});
  const d=allDeals.find(x=>x.id===currentDealId);
  const sigBlock=`<div style="margin-top:40px;padding:20px 24px;border-top:2px solid #C4922A;font-family:sans-serif;font-size:12px"><p style="color:#555;margin-bottom:10px">Electronically signed by <strong>${currentEmail}</strong> on ${now}</p><img src="${sigImg}" style="max-width:320px;border:1px solid #ddd;border-radius:6px;padding:8px;background:#fff;display:block"/></div>`;
  const signedHtml=(d.contract_html||'')+sigBlock;
  const {error}=await sb.rpc('save_signed_contract',{deal_id:currentDealId,signed_html:signedHtml});
  btn.disabled=false;btn.textContent='Save Signature';
  if(error){const s=document.getElementById('sig-status');s.textContent='Error saving. Try again.';s.style.color='#dc2626';return;}
  const s=document.getElementById('sig-status');s.textContent='Contract signed!';s.style.color='#16a34a';
  // Broadcast to main app
  try{window.parent.postMessage({type:'KP_CONTRACT_SIGNED',dealId:currentDealId},'*');}catch(e){}
  try{if(window.opener)window.opener.postMessage({type:'KP_CONTRACT_SIGNED',dealId:currentDealId},'*');}catch(e){}
  // Reload and close
  setTimeout(async()=>{
    document.getElementById('doc-overlay').style.display='none';
    const _f=document.getElementById('doc-frame');
    if(_f._blobUrl){URL.revokeObjectURL(_f._blobUrl);_f._blobUrl=null;}
    _f.src='about:blank';
    const {data}=await sb.rpc('get_client_deals',{client_email:currentEmail});
    if(data){allDeals=data;const active=data.filter(d=>d.stage!=='Archive');const past=data.filter(d=>d.stage==='Archive');
    document.getElementById('active-projects').innerHTML=active.length?active.map(d=>projCard(d,false)).join(''):'<p style="color:#9ca3af;font-size:13px">No active projects.</p>';
    if(past.length){document.getElementById('past-sep').style.display='';document.getElementById('past-projects').innerHTML=past.map(d=>projCard(d,true)).join('');}}
    toast('Contract signed successfully!');
  },1500);
});

function showPortal(email){
  currentEmail=email;
  document.getElementById('login').style.display='none';
  document.getElementById('portal').style.display='flex';
  document.body.classList.add('authed');
  document.getElementById('portal-email').textContent=email;
  loadProjects(email);
}
function showLogin(){document.getElementById('login').style.display='';document.getElementById('portal').style.display='none';document.body.classList.remove('authed');}

sb.auth.getSession().then(({data:{session}})=>{if(session)showPortal(session.user.email);});
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session){window.history.replaceState({},'','/portal');showPortal(session.user.email);}
  if(event==='SIGNED_OUT')showLogin();
});

// Listen for KP_CONTRACT_SIGNED from portal to notify main app
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='KP_CONTRACT_SIGNED'){toast('Contract signed by client!');}
});

// ── Sign In ──
document.getElementById('signinBtn').addEventListener('click',async()=>{
  const email=document.getElementById('p-email').value.trim().toLowerCase();
  const password=document.getElementById('p-password').value;
  if(!email||!email.includes('@')){loginMsg('Please enter your email address.','error');return;}
  if(!password){loginMsg('Please enter your password.','error');return;}
  const btn=document.getElementById('signinBtn');
  btn.disabled=true;btn.textContent='Signing in...';
  const {error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;btn.textContent='Sign In';
  if(error){loginMsg(error.message||'Invalid email or password.','error');return;}
});
document.getElementById('p-password').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('signinBtn').click();});
document.getElementById('p-email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('p-password').focus();});

// ── Sign Up ──
document.getElementById('signupBtn').addEventListener('click',async()=>{
  const email=document.getElementById('s-email').value.trim().toLowerCase();
  const pw=document.getElementById('s-password').value;
  const pw2=document.getElementById('s-password2').value;
  if(!email||!email.includes('@')){loginMsg('Please enter a valid email address.','error');return;}
  if(!pw||pw.length<6){loginMsg('Password must be at least 6 characters.','error');return;}
  if(pw!==pw2){loginMsg('Passwords do not match.','error');return;}
  const btn=document.getElementById('signupBtn');
  btn.disabled=true;btn.textContent='Creating account...';
  const {error}=await sb.auth.signUp({email,password:pw});
  btn.disabled=false;btn.textContent='Create Account';
  if(error){loginMsg(error.message||'Could not create account.','error');return;}
  loginMsg('Account created! Signing you in...','ok');
  const {error:e2}=await sb.auth.signInWithPassword({email,password:pw});
  if(e2){loginMsg('Account created — please sign in below.','ok');}
});
document.getElementById('s-password2').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('signupBtn').click();});

// ── Toggle forms ──
document.getElementById('showSignupBtn').addEventListener('click',()=>{
  document.getElementById('signin-form').style.display='none';
  document.getElementById('signup-form').style.display='block';
  document.getElementById('login-msg').className='login-msg';
});
document.getElementById('showSigninBtn').addEventListener('click',()=>{
  document.getElementById('signup-form').style.display='none';
  document.getElementById('signin-form').style.display='block';
  document.getElementById('login-msg').className='login-msg';
});
document.getElementById('signoutBtn').addEventListener('click',()=>sb.auth.signOut());
</script>
