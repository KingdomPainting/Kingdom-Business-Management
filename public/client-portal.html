<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Client Portal — Kingdom Painting Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#262E4B;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:400px}
.logo-wrap{display:flex;justify-content:center;margin-bottom:28px}
.card{background:#EDE9DE;border-radius:16px;padding:32px 28px;box-shadow:0 8px 40px rgba(0,0,0,.35)}
h2{font-size:20px;font-weight:700;color:#1a1714;margin-bottom:6px}
.sub{font-size:12px;color:#7a6e65;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:#4a3f36;margin-bottom:5px}
input[type=email],input[type=text]{width:100%;padding:10px 13px;border:1.5px solid #c8bfb4;border-radius:8px;font-size:13px;font-family:inherit;color:#1a1714;background:#fff;outline:none;margin-bottom:14px;transition:border-color .15s}
input:focus{border-color:#C4922A}
.btn{width:100%;background:#C4922A;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:12px;display:none}
.msg.error{background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.3);display:block}
.msg.ok{background:rgba(34,197,94,.1);color:#15803d;border:1px solid rgba(34,197,94,.3);display:block}
.back{background:none;border:none;color:#7a6e65;font-family:inherit;font-size:11px;cursor:pointer;margin-top:10px;width:100%}
#step2{display:none}
input[type=text]#code{letter-spacing:.2em;font-size:22px;text-align:center;font-weight:700}

/* Portal */
#portal{display:none}
body.authed{background:#EDE9DE;align-items:flex-start;padding:0}
.header{background:#262E4B;padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
.signout{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;font-family:inherit;font-size:11px;cursor:pointer;padding:5px 12px;border-radius:6px}
.portal-body{max-width:900px;margin:0 auto;padding:32px 24px}
.proj-card{background:#fff;border:1px solid #d6d1c3;border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.proj-name{font-size:15px;font-weight:700;color:#1a1714;margin-bottom:4px}
.proj-stage{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:20px;background:#e8f5e9;color:#2e7d32;display:inline-block;margin-bottom:8px}
.proj-val{font-size:13px;color:#C4922A;font-weight:700}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="wrap">
  <div class="logo-wrap">
    <svg viewBox="0 0 282.7 100" style="height:52px;width:auto" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="0" y1="18.05" x2="47.81" y2="18.05"><stop offset="0" stop-color="#FDC60D"/><stop offset="1" stop-color="#CC9659"/></linearGradient></defs>

      <path fill="none" stroke="#F7F8F8" stroke-width="2" d="M43.4,43.5c0-0.2,0-0.4,0-0.6c-0.1-0.3-0.4-0.6-0.7-0.6c-9.6-2.8-19.3-2.7-25.8-2c-6.5,0.6-11.1,1.8-11.8,2c-0.4,0.1-0.6,0.5-0.6,0.9l0,0.5c0,0.7,0,1.5,0,2.2c0,0.4,0.3,0.8,0.5,1c0.5,0.4,0.9,0.7,1.4,1c0.7,0.5,1.4,1,2.1,1.5c1.2,0.8,2.4,1.6,3.6,2.5c1.7,1.2,2.9,2.5,3.9,3.9c2.1,3.2,3.2,6.3,3.6,9.3c0.2,1.9,0.1,3.6-0.3,5.1c-1.5,5.2-2.2,9.8-2.1,14.2c0,2.9,0.4,5.4,1.1,7.8c0.8,2.9,2.1,5.2,3.8,7.2c0.6,0.7,1.4,1.1,2.2,1.1c0.8,0,1.6-0.4,2.1-1.1c0.6-0.8,1.1-1.4,1.5-2.1c1.8-3,2.9-6.4,3.2-10.5c0.3-3.8,0-7.8-0.9-12c-0.2-1-0.5-1.9-0.7-2.9c-0.2-0.7-0.4-1.4-0.5-2.1c-0.5-2.1-0.5-4.3,0.1-6.7c0.5-2.2,1.4-4.3,2.7-6.5c0.6-1,1.3-2,2.1-2.9c1.3-1.2,2.8-2.2,4.1-3.2c0.5-0.4,1-0.7,1.5-1.1c1.2-0.9,2.5-1.7,3.7-2.6c0.3-0.2,0.6-0.5,0.6-1.1C43.4,44.7,43.4,44.1,43.4,43.5z"/>
      <path fill="#DCB47E" d="M66.3,49.7V20h6.8v29.7H66.3z M72.4,42.9L72,35l14.2-15h7.6L81.1,33.8l-3.8,4.1L72.4,42.9z M86.6,49.7L76,36.8l4.5-4.9l14.1,17.8H86.6z"/>
      <path fill="#DCB47E" d="M97.7,49.7V20h6.9v29.7H97.7z"/>
      <path fill="#DCB47E" d="M111.6,49.7V20h5.7l17.5,21.4H132V20h6.8v29.7h-5.6l-17.6-21.4h2.8v21.4H111.6z"/>
      <path fill="#F7F8F8" d="M66.6,78.6V58.2h8.8c1.8,0,3.4,0.3,4.7,0.9s2.3,1.4,3.1,2.5s1.1,2.4,1.1,4s-0.4,2.8-1.1,3.9s-1.7,2-3.1,2.5s-2.9,0.9-4.7,0.9h-6.2l2.1-2.1v7.7H66.6z M71.3,71.4l-2.1-2.2h5.9c1.5,0,2.5-0.3,3.3-0.9c0.7-0.6,1.1-1.5,1.1-2.6s-0.4-2-1.1-2.6s-1.8-0.9-3.3-0.9h-5.9l2.1-2.2V71.4z"/>
      <path fill="#F7F8F8" d="M83.9,78.6L93,58.2h4.7l9.1,20.4h-4.9l-7.5-18h1.9l-7.5,18H83.9z M88.4,74.2l1.3-3.6h10.5l1.3,3.6H88.4z"/>
      <path fill="#F7F8F8" d="M108.9,78.6V58.2h4.7v20.4H108.9z"/>
      <path fill="#F7F8F8" d="M118.4,78.6V58.2h3.9l12,14.7h-1.9V58.2h4.7v20.4h-3.9l-12-14.7h1.9v14.7H118.4z"/>
      <path fill="#F7F8F8" d="M146.2,78.6V62.1h-6.5v-3.8h17.8v3.8h-6.5v16.5H146.2z"/>
      <path fill="#F7F8F8" d="M159.9,78.6V58.2h4.7v20.4H159.9z"/>
    </svg>
  </div>
  <div class="card">
    <h2>Sign in</h2>
    <p class="sub">Client Portal</p>
    <div id="step1">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
      <button class="btn" id="sendBtn">Send Confirmation Email</button>
    </div>
    <div id="step2">
      <p style="font-size:12px;color:#4a3f36;margin-bottom:14px;line-height:1.6" id="hint"></p>
      <label for="code">6-digit code</label>
      <input type="text" id="code" placeholder="123456" maxlength="6" autocomplete="one-time-code"/>
      <button class="btn" id="verifyBtn">Sign In</button>
      <button class="back" id="backBtn">← Use a different email</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<!-- PORTAL -->
<div id="portal">
  <div class="header">
    <svg viewBox="0 0 160 40" style="height:32px;width:auto" xmlns="http://www.w3.org/2000/svg">
      <path fill="#DCB47E" d="M20,2l-5,3.5L10,0L5,3.5L0,0v14l10,3l10-3V2z"/>
      <path fill="#F7F8F8" d="M30,8h6v20h-6z M36,16l10-8h7l-10,10L36,16z M46,28L36,16l5-5l11,17H46z"/>
      <path fill="#F7F8F8" d="M56,28V8h6v20H56z M65,28V8h4l11,14h-2V8h6v20h-4L69,14h2v14H65z"/>
      <text x="0" y="38" font-family="Montserrat,sans-serif" font-size="8" font-weight="600" fill="#DCB47E" letter-spacing="1">PAINTING INC.</text>
    </svg>
    <button class="signout" id="signoutBtn">Sign out</button>
  </div>
  <div class="portal-body">
    <h2 style="margin-bottom:20px;color:#262E4B">My Projects</h2>
    <div id="projects"><p style="color:#7a6e65;font-size:13px">Loading projects...</p></div>
  </div>
</div>

<script type="module">
// Use ES module import — guarantees supabase-js is loaded before any code runs
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL = 'https://cyzvmcmlpnozwrqifrdt.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5enZtY21scG5vendycWlmcmR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Mzk1MzEsImV4cCI6MjA5NDIxNTUzMX0.IeZRx5xcPddSQcL77vhKjOgAKFi8bKpj3dMfajHpV3c';
const sb = createClient(SUPA_URL, SUPA_KEY);

let currentEmail = '';

function msg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

function showPortal(email) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  document.body.classList.add('authed');
  loadProjects(email);
}

async function loadProjects(email) {
  const el = document.getElementById('projects');
  const { data, error } = await sb.rpc('get_client_deals', { client_email: email });
  if (error || !data || !data.length) {
    el.innerHTML = '<p style="color:#7a6e65;font-size:13px">No projects found for this email.</p>';
    return;
  }
  el.innerHTML = data.map(d => `
    <div class="proj-card">
      <div class="proj-stage">${d.stage||'Lead'}</div>
      <div class="proj-name">${d.dealName||'Unnamed Project'}</div>
      ${d.value ? `<div class="proj-val">$${parseFloat(d.value).toLocaleString()}</div>` : ''}
    </div>
  `).join('');
}

// Auth state
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) showPortal(session.user.email);
});
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) showPortal(session.user.email);
  if (event === 'SIGNED_OUT') { document.getElementById('login').style.display=''; document.getElementById('portal').style.display='none'; document.body.classList.remove('authed'); }
});

// Send OTP
document.getElementById('sendBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email || !email.includes('@')) { msg('Please enter a valid email address.', 'error'); return; }
  currentEmail = email;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('sendBtn').textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('sendBtn').textContent = 'Send Confirmation Email';
  if (error) { msg(error.message, 'error'); return; }
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  document.getElementById('hint').textContent = 'We sent a 6-digit code to ' + email + '. Enter it below.';
  document.getElementById('msg').className = 'msg';
});

// Verify OTP
document.getElementById('verifyBtn').addEventListener('click', async () => {
  const code = document.getElementById('code').value.trim();
  if (!code || code.length < 6) { msg('Please enter the 6-digit code.', 'error'); return; }
  document.getElementById('verifyBtn').disabled = true;
  document.getElementById('verifyBtn').textContent = 'Verifying…';
  const { error } = await sb.auth.verifyOtp({ email: currentEmail, token: code, type: 'email' });
  document.getElementById('verifyBtn').disabled = false;
  document.getElementById('verifyBtn').textContent = 'Sign In';
  if (error) { msg(error.message, 'error'); }
});

// Back
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step1').style.display = 'block';
  document.getElementById('msg').className = 'msg';
});

// Sign out
document.getElementById('signoutBtn').addEventListener('click', () => sb.auth.signOut());

// Enter key
document.getElementById('email').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('sendBtn').click(); });
document.getElementById('code').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('verifyBtn').click(); });
</script>
</body>
</html>
